[project]
name = "laya-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for local GPU-accelerated System 1 inferences powered by laya"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "laya>=0.3.5",
    "mcp>=2.2.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

[project.scripts]
laya-mcp = "laya_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
